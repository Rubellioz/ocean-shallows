<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Ocean Shallows</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
/* Layout: full-bleed WebGL sea. The title rests on the sand (top-left), controls float top-right,
   the creature dock floats bottom-centre on frosted glass. Single committed look: sunlit tropical water. */
:root{
  --sea:#0b3a5c;
  --ink:#0d2b3b;
  --paper:#f5fbfa;
  --glass:rgba(226,244,244,.20);
  --glass-hi:rgba(240,251,250,.42);
  --rim:rgba(255,255,255,.42);
  --sun:#ffe29a;
  --driftwood:#4a3420;
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --ui:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--paper);font-family:var(--ui);}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));box-sizing:border-box;}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.brand{pointer-events:none;min-width:0;max-width:22rem;}
.brand h1{font-family:var(--display);font-weight:650;font-size:clamp(22px,3.1vw,40px);line-height:1;margin:0;color:var(--driftwood);
  letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 0 rgba(255,246,226,.7);font-variation-settings:"opsz" 144;}
.brand p{margin:.45em 0 0;font-size:13px;line-height:1.35;color:#5b4329;max-width:17rem;text-shadow:0 1px 0 rgba(255,246,226,.6);}
.glass{background:var(--glass);border:1px solid var(--rim);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 10px 30px rgba(3,30,50,.22),inset 0 1px 0 rgba(255,255,255,.35);}
.controls{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;flex-wrap:wrap;justify-content:flex-end;}
.controls button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;
  font:600 13px/1 var(--ui);color:var(--paper);cursor:pointer;text-shadow:0 1px 2px rgba(0,30,50,.35);transition:background .18s,color .18s;}
.controls button:hover{background:rgba(255,255,255,.16);}
.controls button[aria-pressed="true"]{background:var(--sun);color:var(--ink);text-shadow:none;}
.controls svg{width:17px;height:17px;flex:none;}
kbd{font:700 10px/1 var(--ui);padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);letter-spacing:.04em;}
.controls button[aria-pressed="true"] kbd{background:rgba(13,43,59,.1);border-color:rgba(13,43,59,.25);}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px;}
.bottom{display:flex;flex-direction:column;align-items:center;gap:8px;}
.counter{pointer-events:none;font:700 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;
  padding:7px 12px;border-radius:999px;color:var(--paper);text-shadow:0 1px 2px rgba(0,30,50,.4);}
.dock{pointer-events:auto;display:flex;gap:10px;padding:10px;border-radius:24px;max-width:100%;box-sizing:border-box;}
.card{all:unset;box-sizing:border-box;width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 9px;border-radius:16px;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  transition:transform .18s ease,background .18s;}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.2);}
.card:active{cursor:grabbing;}
.card.lifting{opacity:.55;transform:scale(.96);}
.card[aria-disabled="true"]{opacity:.5;}
.thumb{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:11px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 25%,rgba(150,235,230,.55),rgba(20,110,150,.35) 70%,rgba(10,60,100,.4));}
.thumb img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;}
.card .nm{font:500 14px/1.15 var(--display);hyphens:manual;overflow-wrap:break-word;max-width:100%;text-align:center;color:var(--paper);margin-top:4px;text-shadow:0 1px 2px rgba(0,30,50,.4);}
.card .sci{font:italic 400 11px/1.2 var(--ui);color:rgba(245,251,250,.78);text-align:center;}
#showUI{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  font:600 12px/1 var(--ui);color:var(--paper);padding:8px 12px;border-radius:999px;cursor:pointer;opacity:.55;display:flex;gap:6px;align-items:center;}
#showUI:hover{opacity:1;}
#showUI[hidden],#ui[hidden]{display:none;}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  font:600 13px/1.3 var(--ui);color:var(--ink);background:rgba(250,253,252,.88);padding:9px 14px;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,30,50,.25);transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:600 16px/1.5 var(--ui);color:var(--paper);background:var(--sea);}
@media (max-width:640px){
  .controls{gap:0;padding:3px;flex-wrap:nowrap;flex:none;}
  .controls button{padding:0 7px;height:34px;}
  .controls button span,.controls kbd{display:none;}
  .brand p{display:none;}
  .dock{gap:6px;padding:7px;border-radius:20px;}
  .card{width:auto;flex:1 1 0;min-width:0;padding:4px 4px 6px;border-radius:13px;}
  .card .nm{font-size:11px;}
  .card .sci{display:none;}
}
@media (max-width:420px){ .brand h1{font-size:20px;} }
@media (prefers-reduced-motion:reduce){ .card,.controls button,#toast{transition:none;} }
</style>
</head>
<body>
<canvas id="sea" aria-label="Bovenaanzicht van een tropische zee met een klein strand. Tik of sleep op het water om rimpelingen te maken."></canvas>
<div id="ui">
  <div class="top">
    <div class="brand">
      <h1>Ocean Shallows</h1>
      <p>Tik op een kaart om een dier in zee te gooien. Sleep een kaart om het boven het water vast te houden en laat dan los.</p>
    </div>
    <nav class="controls glass" aria-label="Bediening van de zee">
      <button id="bRain" type="button" aria-pressed="false" title="Regen (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 15a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 9 3.5 3.5 0 0 1 18 16H7"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg><span>Regen</span><kbd>R</kbd></button>
      <button id="bWhirl" type="button" aria-pressed="false" title="Draaikolk (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 12a1.5 1.5 0 1 1 1.5-1.5c0 2.5-3.5 4-6 2.5S4.5 7.5 8 5.5s9-1 10.5 3S17 18 12 19.5 3 17 3 12"/></svg><span>Draaikolk</span><kbd>W</kbd></button>
      <button id="bCalm" type="button" aria-pressed="false" title="Kalm (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10c2 0 2-1.5 4.5-1.5S9.5 10 12 10s2.5-1.5 4.5-1.5S19 10 21 10M3 15h18"/></svg><span>Kalm</span><kbd>C</kbd></button>
      <button id="bClear" type="button" title="Zee leegmaken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg><span>Zee leegmaken</span></button>
      <button id="bSound" type="button" aria-pressed="false" title="Geluid (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="sndWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><span>Geluid</span><kbd>M</kbd></button>
      <button id="bHide" type="button" title="Menu verbergen (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path d="M4 20L20 4"/></svg><span>Menu verbergen</span><kbd>H</kbd></button>
    </nav>
  </div>
  <div class="bottom">
    <div class="counter glass" id="counter" aria-live="polite">0 roggen · 0 kwallen</div>
    <div class="dock glass" id="dock" role="toolbar" aria-label="Dieren"></div>
  </div>
</div>
<button id="showUI" class="glass" type="button" hidden>Menu tonen <kbd>H</kbd></button>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = Math.random;
const frac = x => x - Math.floor(x);
const h11 = n => frac(Math.sin(n * 127.1) * 43758.5453);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function hash2(x, y){ let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o){ o = o || 4; let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++){ s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= 0.5; } return s; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

if (!window.THREE){ fail('De 3D-bibliotheek is niet geladen. Controleer je internetverbinding en laad de pagina opnieuw.'); return; }
function fail(msg){ const d = document.createElement('div'); d.id = 'fail'; d.textContent = msg; document.body.appendChild(d); }

const canvas = $('#sea');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' }); }
catch (e) { fail('Deze pagina heeft WebGL nodig. Probeer een recente browser met hardwareversnelling aan.'); return; }
renderer.autoClear = false;
renderer.extensions.get('EXT_color_buffer_float');
renderer.extensions.get('EXT_color_buffer_half_float');
renderer.extensions.get('OES_texture_half_float');
renderer.extensions.get('OES_texture_half_float_linear');
const gl = renderer.getContext();
const MAX_PT = (gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE) || [1, 64])[1];

// ------------------------------------------------------------------ world
const SUN = new THREE.Vector2(0.62, -0.78).normalize();     // direction shadows fall
const world = { w: 0, h: 0, W: 0, H: 0, a: 0, upx: 0, D: 0, shoreC: new THREE.Vector2(), shoreR: 0, run: 0, lambda: 0, T: 7.5, breakW: 0 };
const G = 18, HOLD_Z = 11, CAP = 48;

function computeWorld(){
  const w = innerWidth, h = innerHeight;
  world.w = w; world.h = h;
  world.upx = clamp(Math.min(w, h) / 46, 8, 14);
  world.W = w / world.upx; world.H = h / world.upx;
  const a = world.a = Math.min(world.W, world.H);
  world.shoreC.set(-world.W / 2 - 0.25 * a, world.H / 2 + 0.25 * a);
  world.shoreR = 0.68 * a;
  world.run = 0.065 * a;
  world.lambda = 0.15 * a;
  world.breakW = 0.10 * a;
  world.D = (world.H / 2) / Math.tan(15 * Math.PI / 180);
}
function shoreInfo(x, y){
  const dx = x - world.shoreC.x, dy = y - world.shoreC.y; const r = Math.hypot(dx, dy); const th = Math.atan2(dy, dx);
  return { s: r - world.shoreR * (1 + 0.025 * Math.sin(th * 9 + 1.3) + 0.015 * Math.sin(th * 23 + 0.4)), th, nx: dx / r, ny: dy / r };
}

// ------------------------------------------------------------------ shared GLSL
const GLSL_COMMON = `
#define PI 3.14159265
#define TAU 6.2831853
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float h11(float n){ return fract(sin(n*127.1)*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.0,0.0)),u.x), mix(hash12(i+vec2(0.0,1.0)),hash12(i+vec2(1.0,1.0)),u.x), u.y); }
const vec3 W_SH = vec3(0.20,0.80,0.82);
const vec3 W_DP = vec3(0.02,0.12,0.38);
const vec3 W_ABS = vec3(0.60,0.16,0.085);
vec3 waterCol(float d){ return mix(W_SH, W_DP, smoothstep(0.6, 11.0, d)); }
vec3 waterMix(vec3 c, float path, float d){ vec3 T=exp(-W_ABS*path); return c*T + waterCol(d)*(1.0-T); }
uniform sampler2D tDepth; uniform vec2 uWorld;
float depthAt(vec2 p){ return texture2D(tDepth, p/uWorld+0.5).r*20.0-4.0; }
`;

const U = {
  tDepth: { value: null }, uWorld: { value: new THREE.Vector2() }, uSun: { value: SUN }, uTime: { value: 0 },
};

const QUAD_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;

// ------------------------------------------------------------------ ripple simulation
const SIM_UPDATE_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D tPrev; uniform vec2 uTexel; uniform float uCalm;
${GLSL_COMMON}
void main(){
  vec4 info=texture2D(tPrev,vUv);
  float avg=(texture2D(tPrev,vUv+vec2(uTexel.x,0.0)).r+texture2D(tPrev,vUv-vec2(uTexel.x,0.0)).r+
             texture2D(tPrev,vUv+vec2(0.0,uTexel.y)).r+texture2D(tPrev,vUv-vec2(0.0,uTexel.y)).r)*0.25;
  info.g+=(avg-info.r)*2.0;
  vec2 e=min(vUv,1.0-vUv)/uTexel; float ed=min(e.x,e.y);
  float sponge=smoothstep(1.0,28.0,ed);
  float d=texture2D(tDepth,vUv).r*20.0-4.0;
  float damp=mix(0.82,0.994-uCalm*0.02,sponge)*mix(0.55,1.0,smoothstep(-0.1,0.5,d));
  info.g*=damp;
  info.r+=info.g;
  info.r*=mix(0.9,0.9993,sponge);
  if(d<-0.2) info.rg*=0.5;
  gl_FragColor=info;
}`;
const SIM_DROP_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D tPrev; uniform vec2 uWorld; uniform vec4 uDrops[16]; uniform int uCount;
void main(){
  vec4 info=texture2D(tPrev,vUv);
  vec2 p=(vUv-0.5)*uWorld;
  for(int i=0;i<16;i++){
    if(i>=uCount) break;
    vec4 d=uDrops[i];
    float r=length(p-d.xy)/d.z;
    if(r<1.0) info.r+=d.w*(0.5+0.5*cos(r*3.14159265));
  }
  gl_FragColor=info;
}`;

// ------------------------------------------------------------------ composite (seabed + water + beach)
const COMP_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D tBed, tSim, tShadow, tUnder;
uniform vec2 uSimTexel, uShTexel;
uniform float uTime, uSwell, uChop, uRun, uT, uLambda, uBreakW, uOvercast;
uniform vec2 uShoreC; uniform float uShoreR;
uniform vec2 uSun;
uniform vec4 uWhirl;
${GLSL_COMMON}

float caustic(vec2 uv, float t){
  vec2 p=mod(uv*TAU,TAU)-250.0;
  vec2 i=p; float c=1.0; float inten=0.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.0-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c/=4.0; c=1.17-pow(c,1.4);
  return pow(abs(c),8.0);
}
float voroEdge(vec2 p){
  vec2 i=floor(p), f=fract(p); float d1=8.0, d2=8.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y));
    vec2 o=vec2(hash12(i+g),hash12(i+g+19.7));
    vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }
  }
  return sqrt(d2)-sqrt(d1);
}
float lace(vec2 p){
  float a=1.0-smoothstep(0.0,0.13,voroEdge(p));
  float b=1.0-smoothstep(0.0,0.10,voroEdge(p*2.3+5.1));
  float holes=smoothstep(0.25,0.65,vnoise(p*0.45));
  return clamp(max(a,b*0.75)*(0.35+0.65*holes),0.0,1.0);
}
vec2 chopGrad(vec2 p, float t){
  vec2 g=vec2(0.0); vec2 d;
  d=normalize(vec2(-0.6,0.8));  g+=d*cos(dot(d,p)*2.1-t*2.3)*0.050;
  d=normalize(vec2(-0.9,0.3));  g+=d*cos(dot(d,p)*3.3-t*2.9+1.0)*0.042;
  d=normalize(vec2(-0.2,1.0));  g+=d*cos(dot(d,p)*4.7-t*3.4+2.0)*0.034;
  d=normalize(vec2(0.5,0.85));  g+=d*cos(dot(d,p)*6.9-t*4.1+0.3)*0.028;
  d=normalize(vec2(-1.0,-0.2)); g+=d*cos(dot(d,p)*9.3-t*4.8+4.0)*0.022;
  d=normalize(vec2(0.8,-0.5));  g+=d*cos(dot(d,p)*13.1-t*5.6+2.4)*0.018;
  return g;
}
vec2 shadowAt(vec2 uv){
  vec2 o=uShTexel*1.6;
  vec2 s=texture2D(tShadow,uv).rg*0.36;
  s+=texture2D(tShadow,uv+vec2(o.x,o.y)).rg*0.16; s+=texture2D(tShadow,uv+vec2(-o.x,o.y)).rg*0.16;
  s+=texture2D(tShadow,uv+vec2(o.x,-o.y)).rg*0.16; s+=texture2D(tShadow,uv+vec2(-o.x,-o.y)).rg*0.16;
  return s;
}
void main(){
  vec2 uv=vUv; vec2 p=(uv-0.5)*uWorld; float t=uTime;
  vec2 dc=p-uShoreC; float rr=length(dc); float th=atan(dc.y,dc.x); vec2 sdir=dc/rr;
  float s=rr-uShoreR*(1.0+0.025*sin(th*9.0+1.3)+0.015*sin(th*23.0+0.4));
  float lag=0.08*sin(th*3.0+0.5);
  float d=texture2D(tDepth,uv).r*20.0-4.0;
  float dd=max(d,0.0);
  float water=smoothstep(-0.2,0.4,s);

  // ripple sim normal
  float hL=texture2D(tSim,uv-vec2(uSimTexel.x,0.0)).r, hR=texture2D(tSim,uv+vec2(uSimTexel.x,0.0)).r;
  float hD=texture2D(tSim,uv-vec2(0.0,uSimTexel.y)).r, hU=texture2D(tSim,uv+vec2(0.0,uSimTexel.y)).r;
  vec2 gSim=vec2(hR-hL,hU-hD)*1.7;

  // long swell rolling toward the curved shore
  float shoal=1.0+1.4*(1.0-smoothstep(0.0,5.0,dd));
  float ph=t/uT+s/uLambda+lag;
  float u=fract(ph); float wn=floor(ph);
  float wamp=0.75+0.5*h11(wn);
  float A=uSwell*shoal*smoothstep(0.0,2.0,s)*wamp;
  float cw=0.5+0.5*cos(TAU*u);
  float swellH=A*(pow(cw,2.5)*1.6-0.45);
  float dHdu=-A*1.6*2.5*pow(cw,1.5)*PI*sin(TAU*u);
  vec2 gSwell=sdir*dHdu/uLambda;

  vec2 gChop=chopGrad(p,t)*uChop;
  vec2 gFine=(vec2(vnoise(p*6.0+t*vec2(1.3,0.6)),vnoise(p*6.0-t*vec2(0.7,1.1)+7.0))-0.5)*0.26*uChop;

  // whirlpool
  vec2 gW=vec2(0.0); float whirlFoam=0.0; float twist=0.0; float wDark=0.0;
  if(uWhirl.z>0.001){
    vec2 q=p-uWhirl.xy; float ql=max(length(q),1e-3); float r=ql/uWhirl.w; vec2 qn=q/ql; vec2 tang=vec2(-qn.y,qn.x);
    float bowl=exp(-r*r*2.5);
    gW=qn*uWhirl.z*1.6*5.0*r*bowl/uWhirl.w*2.0;
    float ang=atan(q.y,q.x);
    gW+=tang*sin(ang*3.0+log(r+0.05)*7.0+t*5.0)*0.22*uWhirl.z*smoothstep(1.4,0.2,r);
    whirlFoam=smoothstep(0.45,0.95,sin(ang*2.0+log(r+0.05)*5.0+t*3.2))*uWhirl.z*smoothstep(1.3,0.35,r)*smoothstep(0.03,0.2,r);
    whirlFoam*=0.55+0.45*vnoise(p*2.0+t);
    twist=uWhirl.z*2.4*exp(-r*1.8);
    wDark=uWhirl.z*exp(-r*r*5.0);
  }
  vec2 grad=(gSim+gSwell+gChop+gW)*water;
  vec3 N=normalize(vec3(-grad,1.0));
  vec3 Nf=normalize(vec3(-((gSim+gChop+gW)*water+gSwell*water*0.35+gFine*water),1.0));

  // refraction of the seabed
  vec2 refr=-N.xy*min(dd,6.0)*0.55;
  if(uWhirl.z>0.001){ vec2 q=p-uWhirl.xy; float c=cos(twist), sn=sin(twist); refr+=vec2(c*q.x-sn*q.y, sn*q.x+c*q.y)-q; }
  vec2 ruv=clamp(uv+refr/uWorld*water,0.001,0.999);
  vec3 bed=texture2D(tBed,ruv).rgb;
  vec2 shw=shadowAt(ruv);
  float sunLit=(1.0-shw.r*0.62)*(1.0-shw.g*0.6)*(1.0-uOvercast*0.35);

  // caustics
  vec2 cp=(p+refr*0.6+N.xy*dd*1.8)/9.0;
  float ca=caustic(cp,t*0.55)+0.6*caustic(cp*1.37+3.1,t*0.47+2.0);
  ca*=0.75+2.2*max(swellH,0.0);
  float cStr=smoothstep(0.0,0.7,dd)*exp(-dd*0.10)*0.9*water;
  vec3 lit=bed*(0.60+0.44*sunLit)+bed*vec3(0.85,1.0,1.0)*ca*cStr*sunLit;
  vec3 col=waterMix(lit,dd,dd);
  col+=vec3(0.0,0.025,0.06)*(1.0-exp(-dd*0.7))*water;
  col*=1.0-wDark*0.45;
  col*=1.0-(shw.g*0.32+shw.r*0.12)*water*(1.0-uOvercast*0.6);

  // creatures below the surface
  vec4 cu=texture2D(tUnder,clamp(uv+refr/uWorld*0.35*water,0.001,0.999));
  col=col*(1.0-cu.a)+cu.rgb;

  // surface light
  vec3 L=normalize(vec3(-uSun*0.55,1.0)); vec3 Hh=normalize(L+vec3(0.0,0.0,1.0));
  float sunVis=(1.0-shw.g*0.92)*(1.0-uOvercast*0.8);
  float spec=pow(max(dot(Nf,Hh),0.0),1400.0)*4.0;
  float sheen=pow(max(dot(N,Hh),0.0),60.0)*0.10;
  float spark=step(0.9955,hash12(floor(p*9.0)+floor(t*8.0)*0.37))*smoothstep(0.975,0.995,dot(Nf,Hh))*2.5;
  col+=vec3(1.0,0.97,0.9)*(spec+sheen+spark)*sunVis*water;
  float F=0.02+0.98*pow(1.0-N.z,5.0);
  col=mix(col,vec3(0.74,0.88,0.96),clamp(F*3.0,0.0,0.4)*water);
  col*=1.0+swellH*0.35*water;

  // breaking waves and shore foam
  float bz=(1.0-smoothstep(0.0,uBreakW,s))*step(0.0,s);
  float front=smoothstep(0.88,0.985,u)*(1.0-smoothstep(0.993,1.0,u));
  float trail=1.0-smoothstep(0.0,0.3,u);
  float lc=lace(p*1.15+vec2(0.0,t*0.15));
  float breakFoam=bz*wamp*(uSwell/0.3)*(front*(0.7+0.5*lc)+trail*0.9*lc)*(0.5+0.6*vnoise(p*0.4+t*0.05));
  breakFoam*=smoothstep(0.1,0.5,uBreakW-s+uBreakW*0.2);
  float shoreFoam=(1.0-smoothstep(0.0,0.9,s))*step(0.0,s)*0.45*lc;
  float foam=clamp(breakFoam+shoreFoam+whirlFoam*(0.5+0.6*lc),0.0,1.0);
  col=mix(col,vec3(0.96,0.985,1.0)*(1.0-shw.g*0.35),foam*0.92);

  // beach: swash, lace foam, wet sand
  if(s<1.2){
    float Lr=-s;
    float phb=t/uT+lag; float n=floor(phb); float tau=fract(phb);
    float ampn=(0.75+0.5*h11(n)); float ampp=(0.75+0.5*h11(n-1.0));
    float runMax=uRun*ampn*(0.85+0.15*sin(th*7.0+n*1.7));
    float runPrev=uRun*ampp*(0.85+0.15*sin(th*7.0+(n-1.0)*1.7));
    float x=tau<0.3? runMax*sin(tau/0.3*PI*0.5) : runMax*(1.0-pow((tau-0.3)/0.7,0.8));
    float wd=x-Lr;
    float gloss=0.0;
    if(Lr>0.0){
      if(Lr<runMax && tau>0.3){ float tl=0.3+0.7*pow(1.0-Lr/runMax,1.25); float since=(tau-tl)*uT; if(since>0.0) gloss=max(gloss,exp(-since*0.4)); }
      if(Lr<runPrev && wd<0.0){ float tl=0.3+0.7*pow(1.0-Lr/runPrev,1.25); float since=(tau+1.0-tl)*uT; gloss=max(gloss,exp(-since*0.4)); }
    }
    float dampSand=1.0-smoothstep(uRun*0.8,uRun*1.4,Lr);
    float film=smoothstep(0.0,0.3,wd);
    vec2 lq=vec2(th*uShoreR,Lr-x*0.7)*1.35;
    float sl=lace(lq);
    vec2 fr=(vec2(vnoise(lq*1.5),vnoise(lq*1.5+3.0))-0.5)*0.35*film;
    vec3 sand=texture2D(tBed,clamp(uv+fr/uWorld,0.001,0.999)).rgb;
    float wetK=max(dampSand*0.5,gloss*0.85);
    vec3 c=mix(sand,sand*vec3(0.70,0.68,0.66),wetK);
    c*=mix(vec3(1.0),vec3(0.56,0.62,0.76),shw.g*0.85);
    c*=1.0-uOvercast*0.18;
    float gl=gloss*(0.55+0.45*vnoise(p*3.0));
    vec3 Ng=normalize(vec3(-gFine*0.6,1.0));
    c=mix(c,vec3(0.78,0.88,0.95)*0.92,gl*0.16);
    c+=pow(max(dot(Ng,Hh),0.0),140.0)*gl*1.1*sunVis;
    vec3 filmC=c*vec3(0.78,0.94,0.97)+vec3(0.03,0.09,0.10);
    filmC+=pow(max(dot(Nf,Hh),0.0),300.0)*1.5*sunVis;
    c=mix(c,filmC,film);
    float edgeF=exp(-pow((Lr-x)/0.45,2.0))*(tau<0.45?1.0:0.4)*smoothstep(0.0,0.05,x);
    float swashFoam=film*sl*(1.0-smoothstep(0.3,0.95,tau))*0.95+edgeF*(0.55+0.45*sl);
    float bubbles=gloss*step(0.94,hash12(floor(p*14.0)))*0.5;
    c=mix(c,vec3(0.97,0.985,1.0)*(1.0-shw.g*0.35),clamp(swashFoam+bubbles,0.0,1.0)*0.95);
    col=mix(c,col,smoothstep(-0.1,0.3,s)*(1.0-film*0.0));
    if(s>-0.1) col=mix(col,c,film*(1.0-smoothstep(0.0,1.2,s))*0.6);
  }
  col*=1.0-0.16*pow(length(uv-0.5)*1.25,2.5);
  gl_FragColor=vec4(col,1.0);
}`;

// ------------------------------------------------------------------ creature shaders
// uMode: 0 = under water layer, 1 = in the air, 2 = shadow, 3 = thumbnail
const SHADOW_VS = `
  if(uMode>1.5 && uMode<2.5){
    float fl=-max(depthAt(wp.xy),0.0);
    float hgt=max(wp.z-fl,0.0);
    wp.xy+=uSun*hgt*0.55;
    wp.z=0.0;
    vShade=clamp(0.9*exp(-hgt*0.06),0.0,1.0);
  }`;

const RAY_VS = `
precision highp float;
attribute vec4 aST;
attribute vec4 aAnim;
uniform float uSpecies, uSpan, uLen, uTail, uSweep, uThick, uMode, uTime;
uniform vec2 uSun;
${GLSL_COMMON}
varying vec3 vWorld; varying vec3 vN; varying vec4 vST; varying float vXN; varying float vShade; varying float vSeed;
float halfW(float t){
  if(uSpecies<0.5) return t<0.42 ? mix(0.17,1.0,pow(t/0.42,1.5)) : mix(1.0,0.07,pow((t-0.42)/0.58,0.45));
  if(uSpecies<1.5) return t<0.40 ? mix(0.09,1.0,pow(t/0.40,1.3)) : mix(1.0,0.05,pow((t-0.40)/0.60,0.5));
  float x=2.0*t-1.0; return sqrt(max(1.0-x*x,0.0))*(1.0-0.12*t);
}
float tailW(float u){
  if(uSpecies<0.5) return 0.05*(1.0-u)+0.008;
  if(uSpecies<1.5) return 0.04*pow(1.0-u,1.6)+0.004;
  return (0.085*(1.0-u)+0.01)*(1.0+0.9*smoothstep(0.35,0.5,u)*(1.0-smoothstep(0.55,0.95,u)));
}
vec3 bodyPos(float s, float t, float side){
  float hw=halfW(t);
  float xn=s*hw; float ax=abs(xn);
  float fs=sin(aAnim.x-ax*1.3-t*0.6);
  vec3 P;
  P.x=xn*uSpan*0.5*(1.0-0.2*abs(fs*aAnim.y)*ax);
  P.y=(0.5-t)*uLen-uSweep*xn*xn*uLen*0.45;
  float th=uThick*uLen*pow(max(1.0-s*s,0.0),0.7)*pow(sin(3.14159*clamp(t,0.0,1.0)),0.5)*(1.0-0.6*ax);
  P.z=side>0.0? th : -th*0.6;
  P.z+=aAnim.y*fs*pow(ax,1.6)*uSpan*0.30;
  P.z+=aAnim.z*sin(t*10.0-aAnim.x+(s>0.0?0.0:1.3))*pow(ax,2.2)*uSpan*0.10;
  return P;
}
vec3 tailPos(float s, float u, float side){
  float w=tailW(u)*uLen;
  vec3 P;
  P.x=s*w+sin(aAnim.x*0.5-u*3.5+aAnim.w*6.0)*u*u*uTail*0.10;
  P.y=-0.48*uLen-u*uTail;
  P.z=side*w*0.25+sin(aAnim.x-u*2.5)*u*uTail*0.05*(aAnim.y+aAnim.z);
  return P;
}
vec3 cephPos(float v, float u, float side, float sg){
  vec3 P;
  P.x=sg*0.115*uSpan*0.5+v*0.028*uSpan*(1.0-0.35*u)-sg*u*u*0.02*uSpan;
  P.y=0.5*uLen+u*0.17*uLen;
  P.z=side*0.01*uLen-abs(v)*0.015*uSpan-u*u*0.04*uLen;
  return P;
}
void main(){
  float part=aST.w; float side=aST.z;
  vec3 P,P1,P2; float sgn=-1.0;
  vXN=0.0;
  if(part<0.5){ P=bodyPos(aST.x,aST.y,side); P1=bodyPos(aST.x+0.02,aST.y,side); P2=bodyPos(aST.x,aST.y+0.02,side); vXN=aST.x*halfW(aST.y); }
  else if(part<1.5){ P=tailPos(aST.x,aST.y,side); P1=tailPos(aST.x+0.05,aST.y,side); P2=tailPos(aST.x,aST.y+0.02,side); }
  else { float sg=part<2.5?-1.0:1.0; P=cephPos(aST.x,aST.y,side,sg); P1=cephPos(aST.x+0.05,aST.y,side,sg); P2=cephPos(aST.x,aST.y+0.05,side,sg); sgn=1.0; }
  vec3 c=cross(P1-P,P2-P);
  vec3 nrm=length(c)>1e-8? normalize(c)*sgn*side : vec3(0.0,0.0,side);
  mat4 M=modelMatrix*instanceMatrix;
  vec4 wp=M*vec4(P,1.0);
  vN=normalize(mat3(M)*nrm);
  vWorld=wp.xyz; vST=aST; vSeed=aAnim.w; vShade=0.0;
  ${SHADOW_VS}
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;

const RAY_FS = `
precision highp float;
uniform float uSpecies, uSpan, uLen, uMode;
uniform vec2 uSun;
${GLSL_COMMON}
varying vec3 vWorld; varying vec3 vN; varying vec4 vST; varying float vXN; varying float vShade; varying float vSeed;
vec3 spotCell(vec2 q, out float h, out float d, out float r){
  vec2 i=floor(q), f=fract(q);
  vec2 o=vec2(hash12(i+vSeed*13.0),hash12(i+31.7+vSeed))*0.5+0.25;
  h=hash12(i+7.3+vSeed*3.0); d=length(f-o); r=hash12(i+2.1);
  return vec3(0.0);
}
vec3 mantaTop(float xn,float t){
  float ax=abs(xn);
  vec3 c=vec3(0.05,0.055,0.068)+0.03*(1.0-smoothstep(0.0,0.25,ax));
  vec2 q=vec2(ax-0.33,t-0.27); vec2 dir=vec2(0.89,0.45);
  vec2 qr=vec2(dot(q,dir),dot(q,vec2(-dir.y,dir.x)));
  float e=length(qr/vec2(0.21,0.075))+(vnoise(vec2(xn,t)*14.0+vSeed*9.0)-0.5)*0.35;
  float shp=1.0-smoothstep(0.7,1.05,e);
  c=mix(c,vec3(0.84,0.86,0.85),shp*0.9);
  c*=0.92+0.16*vnoise(vec2(xn*30.0,t*30.0));
  return c;
}
vec3 mantaBelly(float xn,float t){
  float ax=abs(xn);
  vec3 c=vec3(0.92,0.93,0.92);
  c=mix(c,vec3(0.22,0.24,0.27),smoothstep(0.6,0.92,ax)*0.85);
  c=mix(c,vec3(0.28,0.28,0.31),smoothstep(0.8,1.0,t)*0.7);
  if(ax>0.11 && ax<0.21 && t>0.22 && t<0.44){ float g=abs(fract((t-0.22)*22.7)-0.5); c=mix(c,vec3(0.2,0.22,0.25),(1.0-smoothstep(0.08,0.16,g))*0.9); }
  float h,d,r; spotCell(vec2(xn*uSpan*0.5,t*uLen)*1.4,h,d,r);
  float sp=(1.0-smoothstep(0.1+0.1*r,0.18+0.1*r,d))*step(0.45,h)*step(ax,0.42)*step(0.3,t)*step(t,0.85);
  c=mix(c,vec3(0.16,0.17,0.2),sp);
  c=mix(c,vec3(0.15,0.15,0.17),smoothstep(0.04,0.0,t)*step(ax,0.17)*0.8);
  return c;
}
vec3 eagleTop(float xn,float t){
  vec3 c=vec3(0.04,0.065,0.11)*(0.85+0.3*vnoise(vec2(xn,t)*5.0));
  float h,d,r; spotCell(vec2(xn*uSpan*0.5,(0.5-t)*uLen)*2.3,h,d,r);
  float rad=0.16+0.1*r;
  float sp;
  if(h>0.62) sp=1.0-smoothstep(0.03,0.07,abs(d-rad));
  else sp=1.0-smoothstep(rad*0.7,rad,d);
  sp*=step(0.18,h)*(1.0-smoothstep(0.82,0.97,abs(xn)))*smoothstep(0.03,0.1,t);
  return mix(c,vec3(0.93,0.95,0.96),sp);
}
vec3 stingTop(float xn,float t){
  vec3 c=vec3(0.66,0.52,0.31)*(0.88+0.24*vnoise(vec2(xn*6.0,t*6.0)+vSeed*10.0));
  c*=1.0-0.15*(1.0-smoothstep(0.0,0.22,abs(xn)))*smoothstep(0.25,0.55,t);
  float h,d,r; spotCell(vec2(xn*uSpan*0.5,(0.5-t)*uLen)*4.6,h,d,r);
  float rad=0.13+0.09*r;
  float sp=(1.0-smoothstep(rad*0.6,rad,d))*step(0.3,h);
  float glow=(1.0-smoothstep(rad,rad*2.0,d))*step(0.3,h);
  c=mix(c,vec3(0.08,0.55,1.0),sp)+vec3(0.0,0.06,0.16)*glow*0.5;
  c=mix(c,vec3(0.10,0.45,0.95),smoothstep(0.88,0.99,length(vec2(xn,(t-0.5)*2.0)))*0.8);
  vec2 lp=vec2(abs(xn)*uSpan*0.5,(0.5-t)*uLen);
  float de=length(lp-vec2(0.11*uSpan,0.27*uLen));
  c=mix(c,vec3(0.85,0.70,0.25),1.0-smoothstep(0.12,0.17,de));
  c=mix(c,vec3(0.04),1.0-smoothstep(0.07,0.10,de));
  float ds=length((lp-vec2(0.10*uSpan,0.16*uLen))/vec2(1.0,0.6));
  c=mix(c,vec3(0.12,0.08,0.05),1.0-smoothstep(0.08,0.11,ds));
  return c;
}
vec3 tailCol(float s,float u){
  if(uSpecies<0.5) return vec3(0.05,0.055,0.07);
  if(uSpecies<1.5) return mix(vec3(0.05,0.07,0.11),vec3(0.16,0.18,0.21),u);
  float band=step(0.5,fract(u*7.0));
  vec3 c=mix(vec3(0.62,0.50,0.30),vec3(0.16,0.13,0.10),band*smoothstep(0.1,0.3,u));
  c=mix(c,vec3(0.1,0.5,1.0),smoothstep(0.45,0.8,abs(s))*smoothstep(0.3,0.45,u));
  return c;
}
void main(){
  if(uMode>1.5 && uMode<2.5){ gl_FragColor=vec4(vShade,0.0,0.0,1.0); return; }
  if(uMode<0.5 && vWorld.z>0.0) discard;
  if(uMode>0.5 && uMode<1.5 && vWorld.z<=0.0) discard;
  float side=vST.z, part=vST.w, t=vST.y;
  vec3 col;
  if(part<0.5){
    if(side>0.0) col= uSpecies<0.5? mantaTop(vXN,t) : (uSpecies<1.5? eagleTop(vXN,t) : stingTop(vXN,t));
    else col= uSpecies<0.5? mantaBelly(vXN,t) : (uSpecies<1.5? vec3(0.93,0.94,0.94)*(1.0-0.25*smoothstep(0.8,1.0,abs(vXN))) : vec3(0.92,0.87,0.78));
  } else if(part<1.5) col=tailCol(vST.x,t);
  else col= side>0.0? vec3(0.06,0.065,0.08) : vec3(0.75,0.75,0.74);
  vec3 N=normalize(vN);
  vec3 L=normalize(vec3(-uSun*0.55,1.0));
  float k;
  if(uMode>2.5) k=0.42+0.75*max(dot(N,normalize(vec3(-0.35,-0.7,0.9))),0.0)+0.15*max(dot(N,vec3(0.6,0.2,0.3)),0.0);
  else k=0.42+0.7*max(dot(N,L),0.0);
  float spec=pow(max(dot(reflect(-L,N),vec3(0.0,0.0,1.0)),0.0),24.0)*0.16;
  col=col*k+spec;
  if(uMode<0.5) col=waterMix(col,-vWorld.z,max(depthAt(vWorld.xy),0.0));
  gl_FragColor=vec4(col,1.0);
}`;

const JELLY_VS = `
precision highp float;
attribute vec2 aBell;
attribute vec4 aJ;
uniform float uSpecies, uBellH, uMode, uPart, uTime;
uniform vec2 uSun;
${GLSL_COMMON}
varying vec3 vWorld; varying vec3 vN; varying vec2 vB; varying float vShade; varying float vFade;
vec3 bellPos(float th, float v, float c){
  float ang=v*1.35;
  float rad=sin(ang)/sin(1.35)*(1.0-c*0.30*v*v);
  float hgt=uBellH*(cos(ang)-cos(1.35))/(1.0-cos(1.35))*(1.0+c*0.3)-c*0.15*pow(v,6.0);
  if(uSpecies>0.5) rad*=1.0+0.035*sin(th*16.0)*pow(v,8.0);
  return vec3(cos(th)*rad,sin(th)*rad,hgt);
}
vec3 fringePos(float th, float w, float c){
  vec3 rim=bellPos(th,1.0,c);
  return rim+vec3(cos(th),sin(th),0.0)*w*(0.16+c*0.14)+vec3(0.0,0.0,-w*(0.42-c*0.12));
}
void main(){
  float c=aJ.x;

function buildPalm(){
  const a = world.a; const perp = new THREE.Vector2(-SUN.y, SUN.x);
  const corner = new THREE.Vector2(-world.W / 2, world.H / 2);
  const root = corner.clone().add(new THREE.Vector2(-0.05 * a, 0.05 * a));
  const L = 0.52 * a, bend = 0.05 * a;
  const crown = root.clone().addScaledVector(SUN, L).addScaledVector(perp, bend);
  const ctrl = root.clone().addScaledVector(SUN, L * 0.5).addScaledVector(perp, bend * 1.8);
  const pos = [], attr = [], idx = [];
  const R = mulberry(77);
  const vtx = (x, y, k, u, f, w) => { pos.push(x, y, 0); attr.push(k, u, f, w); return pos.length / 3 - 1; };
  const N = 48; let prev = null;
  for (let k = 0; k <= N; k++){
    const u = k / N;
    const p = new THREE.Vector2((1 - u) * (1 - u) * root.x + 2 * (1 - u) * u * ctrl.x + u * u * crown.x, (1 - u) * (1 - u) * root.y + 2 * (1 - u) * u * ctrl.y + u * u * crown.y);
    const tg = new THREE.Vector2(2 * (1 - u) * (ctrl.x - root.x) + 2 * u * (crown.x - ctrl.x), 2 * (1 - u) * (ctrl.y - root.y) + 2 * u * (crown.y - ctrl.y)).normalize();
    const nx = -tg.y, ny = tg.x; const w = 0.013 * a * (1 - u * 0.35) * (0.9 + 0.1 * Math.abs(Math.sin(u * 90)));
    const i0 = vtx(p.x + nx * w, p.y + ny * w, 0, u, 0, 0), i1 = vtx(p.x - nx * w, p.y - ny * w, 0, u, 0, 0);
    if (prev) idx.push(prev[0], prev[1], i0, prev[1], i1, i0);
    prev = [i0, i1];
  }
  const NF = 10;
  for (let f = 0; f < NF; f++){
    const base = f / NF * TAU + (R() - 0.5) * 0.4; const Lf = a * (0.15 + 0.06 * R()); const curl = (R() - 0.5) * 0.9;
    const M = 18; let p = crown.clone(); let mprev = null;
    for (let k = 1; k <= M; k++){
      const u = k / M; const an = base + curl * u; const dir = new THREE.Vector2(Math.cos(an), Math.sin(an));
      const np = p.clone().addScaledVector(dir, Lf / M);
      const nx = -dir.y, ny = dir.x, w = 0.004 * a * (1 - u * 0.6);
      const i0 = vtx(np.x + nx * w, np.y + ny * w, 1, u, f, 0), i1 = vtx(np.x - nx * w, np.y - ny * w, 1, u, f, 0);
      if (mprev) idx.push(mprev[0], mprev[1], i0, mprev[1], i1, i0);
      mprev = [i0, i1];

        const la = an + sd * (1.25 - 0.5 * u); const ll = Lf * 0.27 * Math.sin(Math.PI * Math.min(u * 1.15, 1)) * (0.8 + 0.4 * R());
        const tipx = np.x + Math.cos(la) * ll, tipy = np.y + Math.sin(la) * ll; const lw = 0.008 * a;
        const b0 = vtx(np.x + dir.x * lw, np.y + dir.y * lw, 1, u, f, 0), b1 = vtx(np.x - dir.x * lw, np.y - dir.y * lw, 1, u, f, 0), tp = vtx(tipx, tipy, 1, u, f, 1);
        idx.push(b0, b1, tp);
      }
      p = np;
    }
  }

  const cc = vtx(crown.x, crown.y, 1, 0, 0, 0); const rc = 0.025 * a;
  for (let k = 0; k <= 16; k++){ const an = k / 16 * TAU; vtx(crown.x + Math.cos(an) * rc, crown.y + Math.sin(an) * rc, 1, 0, 0, 0); if (k) idx.push(cc, cc + k, cc + k + 1); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aPalm', new THREE.Float32BufferAttribute(attr, 4));
  geo.setIndex(idx);
  return { geo, crown };
}

class Ribbons {
  constructor(maxPts){
    this.max = maxPts;
    this.pos = new Float32Array(maxPts * 6); this.rib = new Float32Array(maxPts * 6); this.idx = new Uint16Array(maxPts * 6);
    const g = this.geo = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aRib', new THREE.BufferAttribute(this.rib, 3).setUsage(THREE.DynamicDrawUsage));
    g.setIndex(new THREE.BufferAttribute(this.idx, 1).setUsage(THREE.DynamicDrawUsage));
    this.mesh = new THREE.Mesh(g, cmat(RIB_VS, RIB_FS, {}, { side: THREE.DoubleSide, transparent: true, depthWrite: false }));
    this.mesh.frustumCulled = false; this.mesh.renderOrder = 1;
  }
  write(list, cam, time){
    let v = 0, ii = 0; const P = this.pos, Rb = this.rib, I = this.idx;
    for (const j of list){ if (!j.chains) continue; const sz = j.size * j.fade;
      for (const ch of j.chains){
        const n = ch.n; if (v + n * 2 > this.max * 2) break;
        const p = ch.p;
        for (let i = 0; i < n; i++){
          const a = Math.max(0, i - 1) * 3, b = Math.min(n - 1, i + 1) * 3, o = i * 3;
          let tx = p[b] - p[a], ty = p[b + 1] - p[a + 1], tz = p[b + 2] - p[a + 2];
          let cx = cam.x - p[o], cy = cam.y - p[o + 1], cz = cam.z - p[o + 2];
          let sx = ty * cz - tz * cy, sy = tz * cx - tx * cz, sz2 = tx * cy - ty * cx;
          let l = Math.hypot(sx, sy, sz2); if (l < 1e-6){ sx = 1; sy = 0; sz2 = 0; l = 1; }
          const vv = i / (n - 1);
          let w = ch.kind === 0 ? 0.075 * sz * (1 - 0.6 * vv) : 0.42 * sz * (0.45 + 0.75 * Math.sin(Math.PI * Math.min(vv * 1.4, 1))) * (1 + 0.22 * Math.sin(vv * 18 + time * 2 + ch.ang * 3));
          w /= l;
          const q = v * 3;
          P[q] = p[o] + sx * w; P[q + 1] = p[o + 1] + sy * w; P[q + 2] = p[o + 2] + sz2 * w;
          P[q + 3] = p[o] - sx * w; P[q + 4] = p[o + 1] - sy * w; P[q + 5] = p[o + 2] - sz2 * w;
          Rb[q] = 1; Rb[q + 1] = vv; Rb[q + 2] = ch.kind; Rb[q + 3] = -1; Rb[q + 4] = vv; Rb[q + 5] = ch.kind;
          if (i < n - 1){ I[ii++] = v; I[ii++] = v + 1; I[ii++] = v + 2; I[ii++] = v + 1; I[ii++] = v + 3; I[ii++] = v + 2; }
          v += 2;
        }
      }
    }
    this.geo.setDrawRange(0, ii);
    this.geo.attributes.position.needsUpdate = true; this.geo.attributes.aRib.needsUpdate = true; this.geo.index.needsUpdate = true;
    this.mesh.visible = ii > 0;
  }
}
const ribbons = new Ribbons(9000);

function inBounds(x, y, m){ return Math.abs(x) < world.W / 2 - m && Math.abs(y) < world.H / 2 - m; }

  let px = clamp(x, -world.W / 2 + 2, world.W / 2 - 2), py = clamp(y, -world.H / 2 + 2, world.H / 2 - 2);
  for (let i = 0; i < 300 && depthAt(px, py) < minD; i++){
    const si = shoreInfo(px, py); px += si.nx * 0.5; py += si.ny * 0.5;
    px = clamp(px, -world.W / 2 + 2, world.W / 2 - 2); py = clamp(py, -world.H / 2 + 2, world.H / 2 - 2);
    if (i > 100){ px = lerp(px, world.W * 0.2, 0.05); py = lerp(py, -world.H * 0.1, 0.05); }

  return { x: px, y: py };
}
function dockTopWorld(){ const r = $('#dock').getBoundingClientRect(); return (0.5 - r.top / world.h) * world.H; }
function randomWaterTarget(key){
  const sp = SPECIES[key]; const need = sp.kind === 'ray' ? sp.minDepth + 0.6 : 2.2;
  const yMin = Math.min(dockTopWorld() + 3, world.H * 0.1), yMax = world.H / 2 - 6;
  for (let i = 0; i < 60; i++){
    const x = (rnd() - 0.5) * (world.W - 14), y = lerp(yMin, yMax, rnd());
    const d = depthAt(x, y);

  return seawardPoint(world.W * 0.15, 0, need);
}

    rate: sp.rate * (0.85 + 0.3 * rnd()), size: sp.size * (0.8 + 0.4 * rnd()), spin: rnd() * TAU, spinV: 0, seed: rnd(), mode: 'drift', fade: 1, removing: false,

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _ax = new THREE.Vector3();
const ZAX = new THREE.Vector3(0, 0, 1);
const dummy = new THREE.Object3D(); dummy.rotation.order = 'ZXY';
function jellyMatrix(j, out){
  _ax.set(j.ax, j.ay, j.az).normalize();
  _q.setFromUnitVectors(ZAX, _ax); _q2.setFromAxisAngle(ZAX, j.spin); _q.multiply(_q2);
  const s = j.size * j.fade; _s.set(s, s, s); _v.set(j.x, j.y, j.z);

}
function chainRoot(j, ch, M, out){

}
function resetChains(j){

  for (const ch of j.chains){ chainRoot(j, ch, M, r); const seg = ch.seg * j.size;
    for (let i = 0; i < ch.n; i++){ const o = i * 3; ch.p[o] = ch.pp[o] = r.x - _ax.x * seg * i; ch.p[o + 1] = ch.pp[o + 1] = r.y - _ax.y * seg * i; ch.p[o + 2] = ch.pp[o + 2] = r.z - _ax.z * seg * i; } }
}
const _r = new THREE.Vector3();
function updateChains(j, dt){
  const M = jellyMatrix(j, _m);
  for (const ch of j.chains){
    const p = ch.p, pp = ch.pp, n = ch.n, seg = ch.seg * j.size * j.fade;
    chainRoot(j, ch, M, _r); p[0] = pp[0] = _r.x; p[1] = pp[1] = _r.y; p[2] = pp[2] = _r.z;
    for (let i = 1; i < n; i++){
      const o = i * 3; const air = p[o + 2] > 0;
      const damp = air ? 0.985 : 0.9; const az = air ? -G : -0.35;
      const vx = (p[o] - pp[o]) * damp, vy = (p[o + 1] - pp[o + 1]) * damp, vz = (p[o + 2] - pp[o + 2]) * damp;
      pp[o] = p[o]; pp[o + 1] = p[o + 1]; pp[o + 2] = p[o + 2];
      p[o] += vx; p[o + 1] += vy; p[o + 2] += vz + az * dt * dt;
    }
    for (let it = 0; it < 3; it++) for (let i = 1; i < n; i++){
      const a = (i - 1) * 3, b = i * 3;
      const dx = p[b] - p[a], dy = p[b + 1] - p[a + 1], dz = p[b + 2] - p[a + 2]; const l = Math.hypot(dx, dy, dz) || 1e-6; const df = (l - seg) / l;

    }
    for (let i = 1; i < n; i++){ const o = i * 3; const fl = -Math.max(depthAt(p[o], p[o + 1]), 0) + 0.05; if (p[o + 2] < fl) p[o + 2] = fl; }

const contraction = ph => ph < 0.22 ? Math.sin(ph / 0.22 * Math.PI / 2) : Math.pow(1 - (ph - 0.22) / 0.78, 2) * (3 - 2 * (1 - (ph - 0.22) / 0.78)) / 1;

function currentAt(x, y, t){
  return { x: 0.22 + 0.35 * Math.sin(y * 0.07 + t * 0.05) + 0.15 * Math.sin(x * 0.11 - t * 0.07),
           y: -0.08 + 0.35 * Math.cos(x * 0.06 - t * 0.04) + 0.15 * Math.cos(y * 0.13 + t * 0.06) };
}
function whirlForce(x, y, k){
  if (whirl.str < 0.01) return null;
  const dx = x - whirl.x, dy = y - whirl.y, d = Math.hypot(dx, dy) + 0.01; const R = whirl.R;
  if (d > R * 2.6) return null;
  const f = whirl.str * k * Math.exp(-d / (R * 1.1));
  return { x: (-dy / d) * f * 2.4 - (dx / d) * f * 0.9, y: (dx / d) * f * 2.4 - (dy / d) * f * 0.9, d };

// splashes, droplets, silt
function splash(x, y, power){
  addDrop(x, y, 0.9 * power + 0.6, -1.3 * power);
  airFx.add({ type: 1, x, y, z: 0.03, vx: 0, vy: 0, vz: 0, size: 0.8, grow: 7 * power, life: 1.5, age: 0, alpha: 0.9 });
  airFx.add({ type: 1, x, y, z: 0.03, vx: 0, vy: 0, vz: 0, size: 0.4, grow: 4.5 * power, life: 1.2, age: -0.18, alpha: 0.8 });
  const n = Math.round(14 + 24 * power);
  for (let i = 0; i < n; i++){ const a = rnd() * TAU, s = 1.2 + rnd() * 3.6 * power;
    airFx.add({ type: 0, x: x + Math.cos(a) * 0.3, y: y + Math.sin(a) * 0.3, z: 0.05, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: 3.5 + rnd() * 6 * power, size: 0.1 + rnd() * 0.17, life: 4, age: 0, alpha: 0.95 }); }
  Snd.splash(power, x / (world.W / 2));

}
function drip(x, y, z){ airFx.add({ type: 0, x, y, z, vx: (rnd() - 0.5) * 0.3, vy: (rnd() - 0.5) * 0.3, vz: -0.5, size: 0.09 + rnd() * 0.06, life: 4, age: 0, alpha: 0.9, drip: true }); }
function puff(x, y){
  const fl = -Math.max(depthAt(x, y), 0);
  for (let i = 0; i < 18; i++){ const a = rnd() * TAU, s = 0.5 + rnd() * 1.4;
    underFx.add({ type: 2, x: x + Math.cos(a) * 0.5, y: y + Math.sin(a) * 0.5, z: fl + 0.15, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: 0.15 + rnd() * 0.35, size: 0.8 + rnd() * 0.7, grow: 1.6, life: 2.6 + rnd() * 1.2, age: 0, alpha: 0.6 }); }

function updateFx(dt){
  for (let i = airFx.items.length - 1; i >= 0; i--){
    const p = airFx.items[i]; p.age += dt; if (p.age < 0) continue;
    if (p.type === 0){
      p.vz -= G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.z < 0){ airFx.items.splice(i, 1); if (depthAt(p.x, p.y) > 0){ addDrop(p.x, p.y, 0.35, p.drip ? -0.25 : -0.12); if (p.drip || rnd() < 0.12) Snd.plink(p.x / (world.W / 2), p.drip ? 0.08 : 0.04); } continue; }
    } else { const k = p.age / p.life; p.size += p.grow * dt * (1 - k * 0.6); p.alpha = (1 - k) * (p.type === 1 ? 0.9 : 0.6); }
    if (p.age > p.life) airFx.items.splice(i, 1);
  }
  for (let i = underFx.items.length - 1; i >= 0; i--){
    const p = underFx.items[i]; p.age += dt; const k = p.age / p.life;
    const dmp = Math.exp(-2.2 * dt); p.vx *= dmp; p.vy *= dmp; p.vz *= dmp;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.size += p.grow * dt; p.alpha = 0.55 * Math.sin(Math.PI * Math.min(1, k * 1.1 + 0.05)) * (1 - k);

function scareAt(x, y, rad){
  for (const r of rays){
    if (r.mode !== 'swim' && r.mode !== 'rest') continue;
    const d = Math.hypot(r.x - x, r.y - y); if (d > rad) continue;
    if (r.mode === 'rest'){ puff(r.x, r.y); r.mode = 'swim'; r.swimT = 5 + rnd() * 6; }
    r.flee = 1.6; r.fleeAngle = Math.atan2(r.y - y, r.x - x);

function updateRay(r, dt, t){

    r.x += (r.hx - r.x) * k; r.y += (r.hy - r.y) * k; r.z += (HOLD_Z + Math.sin(t * 2) * 0.2 - r.z) * Math.min(1, dt * 6);

    r.vz *= Math.exp(-3 * dt); r.z += r.vz * dt; r.z = Math.max(r.z, fl + sp.clear * 0.6);
    r.vx *= Math.exp(-2 * dt); r.vy *= Math.exp(-2 * dt); r.x += r.vx * dt; r.y += r.vy * dt;

    r.flapPhase += dt * TAU * sp.flapRate; r.flapAmp = lerp(r.flapAmp, sp.flap, dt * 2); r.undAmp = lerp(r.undAmp, sp.und, dt * 2);
    if (r.modeT > 0.9){ r.mode = 'swim'; r.pitch = 0; r.roll = 0; r.swimT = 5 + rnd() * 6; }
    if (depth < sp.minDepth * 0.7){ const g = seawardPoint(r.x, r.y, sp.minDepth + 0.5); r.heading = Math.atan2(g.y - r.y, g.x - r.x); }
    return;

    r.flapPhase += dt * TAU * 0.25; r.undAmp = lerp(r.undAmp, 0.12, dt); r.restT -= dt; r.bank = lerp(r.bank, 0, dt * 2); r.roll = r.bank; r.pitch = lerp(r.pitch, 0, dt * 2);

    if (r.z > -0.1){ r.mode = 'air'; r.modeT = 0; r.vz = 8.5 + rnd() * 2.5; r.airDur = 2 * r.vz / G; r.vx = Math.cos(r.heading) * r.speed; r.vy = Math.sin(r.heading) * r.speed;
      r.flipType = r.sp === 'manta' ? 'pitch' : 'roll'; r.flipDir = rnd() < 0.5 ? 1 : -1; splash(r.x, r.y, sp.splash * 0.8); }

  tz = Math.min(tz, -0.25);

  if (r.sp === 'sting'){ r.swimT -= dt; if (r.swimT <= 0 && depth > 0.8 && depth < 7 && r.flee <= 0){ r.mode = 'rest'; r.restT = 8 + rnd() * 14; } }
}

function updateJelly(j, dt, t){
  const sp = SPECIES[j.sp];
  if (j.mode === 'held'){
    const ox = j.x, oy = j.y; const k = Math.min(1, dt * 12);
    j.x += (j.hx - j.x) * k; j.y += (j.hy - j.y) * k; j.z += (HOLD_Z + Math.sin(t * 2) * 0.2 - j.z) * Math.min(1, dt * 6);
    j.vx = (j.x - ox) / dt; j.vy = (j.y - oy) / dt;
    j.ax = lerp(j.ax, -j.vx * 0.02, dt * 4); j.ay = lerp(j.ay, -j.vy * 0.02, dt * 4); j.az = 1;
    j.phase = (j.phase + dt * j.rate * 0.6) % 1; j.c = contraction(j.phase) * 0.6;
    j.dripT -= dt; if (j.dripT <= 0){ j.dripT = 0.07 + rnd() * 0.12;
      if (j.chains){ const ch = j.chains[(rnd() * j.chains.length) | 0]; const i = ch.n - 1 - ((rnd() * 4) | 0); drip(ch.p[i * 3], ch.p[i * 3 + 1], ch.p[i * 3 + 2] - 0.1); }
      else { const a = rnd() * TAU; drip(j.x + Math.cos(a) * j.size, j.y + Math.sin(a) * j.size, j.z - 0.4); } }
  } else if (j.mode === 'fly'){
    j.vz -= G * dt; j.x += j.vx * dt; j.y += j.vy * dt; j.z += j.vz * dt; j.spin += j.spinV * dt;
    if (j.z <= 0 && j.vz < 0){ splash(j.x, j.y, sp.splash); j.mode = 'drift'; j.vz = -1.2; j.vx *= 0.15; j.vy *= 0.15; }
  } else {
    const prevC = j.c; j.phase += dt * j.rate; if (j.phase >= 1) j.phase -= 1; j.c = contraction(j.phase) * (j.removing ? 0.3 : 1);
    const thrust = Math.max(0, j.c - prevC) * sp.thrust;
    const cur = currentAt(j.x, j.y, t); const drag = Math.min(1, dt * 0.8);
    j.vx += (cur.x - j.vx) * drag + j.ax * thrust; j.vy += (cur.y - j.vy) * drag + j.ay * thrust; j.vz += (0 - j.vz) * Math.min(1, dt * 1.2) + j.az * thrust * 0.6 - 0.12 * dt;
    const wf = whirlForce(j.x, j.y, 1.6); if (wf){ j.vx += (wf.x - j.vx * 0.3) * dt * 2; j.vy += (wf.y - j.vy * 0.3) * dt * 2; j.spinV += whirl.str * dt * 0.8; if (wf.d < whirl.R * 0.6) j.vz -= whirl.str * dt * 1.2; }

    if (depth < 1.6){ const si = shoreInfo(j.x, j.y); j.vx += si.nx * dt * 1.5; j.vy += si.ny * dt * 1.5; }
    const mx = world.W / 2 - 2, my = world.H / 2 - 2;
    if (j.x > mx) j.vx -= (j.x - mx) * dt * 0.8; if (j.x < -mx) j.vx -= (j.x + mx) * dt * 0.8;
    if (j.y > my) j.vy -= (j.y - my) * dt * 0.8; if (j.y < -my) j.vy -= (j.y + my) * dt * 0.8;
    j.x += j.vx * dt; j.y += j.vy * dt; j.z += j.vz * dt;
    const fl = -Math.max(depth, 0);
    j.z = clamp(j.z, Math.min(fl + 0.4 + j.size * 0.5, -0.5), -0.35 - j.size * 0.3);
    j.wander += (rnd() - 0.5) * dt * 1.4;
    const tzk = clamp((j.tz - j.z) * 0.35, -0.6, 0.6);
    const tax = Math.cos(j.wander) * 0.5, tay = Math.sin(j.wander) * 0.5, taz = 0.55 + tzk;
    j.ax += (tax - j.ax) * dt * 0.4; j.ay += (tay - j.ay) * dt * 0.4; j.az += (taz - j.az) * dt * 0.4;
    const l = Math.hypot(j.ax, j.ay, j.az); j.ax /= l; j.ay /= l; j.az /= l;
    j.spinV *= Math.exp(-dt * 0.5); j.spin += (0.08 + j.spinV) * dt;
  }

}

// spawn / remove
function spawn(key, x, y, z){
  const sp = SPECIES[key];
  const c = sp.kind === 'ray' ? makeRay(key, x, y, z) : makeJelly(key, x, y, z);
  (sp.kind === 'ray' ? rays : jellies).push(c); updateCounter();
  return c;
}
function seedSea(){
  const add = (key, n) => { for (let i = 0; i < n; i++){ const tgt = randomWaterTarget(key); const sp = SPECIES[key];
    const fl = -depthAt(tgt.x, tgt.y);
    const c = spawn(key, tgt.x, tgt.y, sp.kind === 'ray' ? (sp.zr ? Math.max(sp.zr[0] - 1, fl + sp.clear) : fl + 0.1) : Math.max(-1.5 - rnd() * 2, fl + 1.5));
    if (key === 'sting'){ c.mode = 'rest'; c.restT = 4 + rnd() * 10; }
    if (c.chains) resetChains(c); } };
  add('manta', 1); add('eagle', 1); add('sting', 2); add('moon', 3); add('nettle', 2);
}
function clearSea(){
  for (const c of [...rays, ...jellies]) if (c.mode !== 'held'){ c.removing = true; addDrop(c.x, c.y, 1.2, -0.25); }
}

// write instances
function writeInstances(){
  const cnt = { manta: 0, eagle: 0, sting: 0 };
  for (const r of rays){
    const m = meshes[r.sp]; const n = cnt[r.sp]++;
    dummy.position.set(r.x, r.y, r.z); dummy.rotation.set(r.pitch, r.roll, r.heading - Math.PI / 2, 'ZXY');
    const s = r.scale * r.fade; dummy.scale.set(s, s, s); dummy.updateMatrix(); m.setMatrixAt(n, dummy.matrix);
    m.geometry.attributes.aAnim.setXYZW(n, r.flapPhase, r.flapAmp, r.undAmp, r.seed);
  }
  for (const k of ['manta', 'eagle', 'sting']){ const m = meshes[k]; m.count = cnt[k]; m.instanceMatrix.needsUpdate = true; m.geometry.attributes.aAnim.needsUpdate = true; }
  const jc = { moon: 0, nettle: 0 };
  for (const j of jellies){
    const m = meshes[j.sp]; const n = jc[j.sp]++;
    jellyMatrix(j, _m); m.setMatrixAt(n, _m); m.geometry.attributes.aJ.setXYZW(n, j.c, j.seed, 0, j.fade);
    if (j.sp === 'moon'){ meshes.fringe.setMatrixAt(n, _m); meshes.fringe.geometry.attributes.aJ.setXYZW(n, j.c, j.seed, 0, j.fade); }
  }
  for (const k of ['moon', 'nettle']){ const m = meshes[k]; m.count = jc[k]; m.instanceMatrix.needsUpdate = true; m.geometry.attributes.aJ.needsUpdate = true; }
  meshes.fringe.count = jc.moon; meshes.fringe.instanceMatrix.needsUpdate = true; meshes.fringe.geometry.attributes.aJ.needsUpdate = true;
}

// ------------------------------------------------------------------ sound
const Snd = {
  ctx: null, on: false, master: null, noise: null, lastPlink: 0,

    const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.noise = buf;
    const bb = c.createBuffer(1, len, c.sampleRate); const bd = bb.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const src = c.createBufferSource(); src.buffer = bb; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = c.createGain(); g.gain.value = 0.25; src.connect(lp); lp.connect(g); g.connect(this.master); src.start();
  },
  setOn(v){ this.ensure(); if (!this.ctx) return; this.on = v; if (v) this.ctx.resume(); const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(v ? 0.9 : 0, t, 0.15); },
  out(p){ const c = this.ctx; if (c.createStereoPanner){ const s = c.createStereoPanner(); s.pan.value = clamp(p, -1, 1); s.connect(this.master); return s; } const g = c.createGain(); g.connect(this.master); return g; },
  src(){ const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = true; return s; },
  surf(amp, T, lead){

    const s1 = this.src(), f1 = c.createBiquadFilter(), g1 = c.createGain(); f1.type = 'lowpass'; f1.Q.value = 0.5;
    f1.frequency.setValueAtTime(500, t); f1.frequency.linearRampToValueAtTime(2600, t + 0.35); f1.frequency.exponentialRampToValueAtTime(650, t + T * 0.32);
    g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(0.5 * amp, t + 0.32); g1.gain.exponentialRampToValueAtTime(0.12 * amp, t + T * 0.3); g1.gain.exponentialRampToValueAtTime(0.0005, t + T * 0.55);
    s1.connect(f1); f1.connect(g1); g1.connect(out); s1.start(t, Math.random() * 2); s1.stop(t + T * 0.6);
    const s2 = this.src(), f2 = c.createBiquadFilter(), g2 = c.createGain(); f2.type = 'bandpass'; f2.frequency.value = 3400; f2.Q.value = 0.7;
    g2.gain.setValueAtTime(0.0001, t + T * 0.28); g2.gain.exponentialRampToValueAtTime(0.10 * amp, t + T * 0.42); g2.gain.exponentialRampToValueAtTime(0.0001, t + T * 0.92);
    s2.connect(f2); f2.connect(g2); g2.connect(out); s2.start(t + T * 0.27, Math.random() * 2); s2.stop(t + T * 0.95);
  },
  splash(power, pan){

    const s = this.src(), f = c.createBiquadFilter(), g = c.createGain(); f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(2800, t); f.frequency.exponentialRampToValueAtTime(480, t + 0.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55 * Math.min(power, 1.6), t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

// ------------------------------------------------------------------ UI
const toastEl = $('#toast'); let toastT = 0;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600); }
function updateCounter(){
  const nr = rays.filter(r => !r.removing).length, nj = jellies.filter(j => !j.removing).length;
  $('#counter').textContent = `${nr} ${nr === 1 ? 'rog' : 'roggen'} · ${nj} ${nj === 1 ? 'kwal' : 'kwallen'}`;
  const full = count() >= CAP;
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-disabled', full ? 'true' : 'false'));
}
const fullMsg = () => toast(`De zee is vol: maximaal ${CAP} dieren. Maak de zee leeg om nieuwe toe te voegen.`);
const dock = $('#dock');
const cards = {};
for (const key of KEYS){
  const sp = SPECIES[key];
  const b = document.createElement('button'); b.type = 'button'; b.className = 'card'; b.dataset.sp = key;
  b.setAttribute('aria-label', `${sp.name}: tik om te gooien, sleep om neer te zetten`);
  b.innerHTML = `<span class="thumb"><img alt=""></span><span class="nm">${sp.name}</span><span class="sci">${sp.sci}</span>`;
  dock.appendChild(b); cards[key] = b;
}
function screenToWorld(px, py, z){
  const k = (world.D - z) / world.D;
  return { x: (px / world.w - 0.5) * world.W * k, y: (0.5 - py / world.h) * world.H * k };
}
function throwCreature(key, card){
  if (count() >= CAP){ fullMsg(); return; }
  const sp = SPECIES[key];
  const rc = card.getBoundingClientRect(); const z0 = 6;
  const p0 = screenToWorld(rc.left + rc.width / 2, rc.top + rc.height * 0.35, z0);
  const tgt = randomWaterTarget(key);
  const c = spawn(key, p0.x, p0.y, z0);
  const T = 1.25; c.vx = (tgt.x - p0.x) / T; c.vy = (tgt.y - p0.y) / T; c.vz = (-z0 + 0.5 * G * T * T) / T;
  c.mode = 'fly'; c.spinV = (rnd() < 0.5 ? -1 : 1) * (sp.kind === 'ray' ? 4 : 2);
  if (sp.kind === 'ray'){ c.heading = Math.atan2(c.vy, c.vx); c.flapAmp = sp.flap * 0.6; }
  else { c.ax = 0; c.ay = 0; c.az = 1; if (c.chains) resetChains(c); }
}
const drag = { pending: null, c: null, card: null };
for (const key of KEYS){
  const card = cards[key];
  card.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    e.preventDefault(); card.setPointerCapture(e.pointerId);
    drag.pending = { key, x: e.clientX, y: e.clientY, id: e.pointerId }; drag.c = null; drag.card = card;
  });
  card.addEventListener('pointermove', e => {
    const p = drag.pending; if (!p || p.id !== e.pointerId) return;
    if (!drag.c){
      if (Math.hypot(e.clientX - p.x, e.clientY - p.y) < 9) return;
      if (count() >= CAP){ fullMsg(); drag.pending = null; return; }
      const w = screenToWorld(e.clientX, e.clientY, HOLD_Z);
      const c = drag.c = spawn(key, w.x, w.y, HOLD_Z); c.mode = 'held'; c.hx = w.x; c.hy = w.y; c.dripT = 0;
      if (c.kind === 'jelly'){ c.ax = 0; c.ay = 0; c.az = 1; if (c.chains) resetChains(c); }
      else { c.heading = Math.PI / 2; c.flapAmp = 0.3; }
      card.classList.add('lifting');
    }
    const w = screenToWorld(e.clientX, e.clientY, HOLD_Z); drag.c.hx = w.x; drag.c.hy = w.y;
  });
  const end = (e, cancel) => {
    const p = drag.pending; if (!p || p.id !== e.pointerId) return;
    if (drag.c) releaseHeld(drag.c); else if (!cancel) throwCreature(key, card);
    card.classList.remove('lifting'); drag.pending = null; drag.c = null;
  };
  card.addEventListener('pointerup', e => end(e, false));
  card.addEventListener('pointercancel', e => end(e, true));
  card.addEventListener('click', e => { if (e.detail === 0) throwCreature(key, card); });
}
function releaseHeld(c){
  const sp = SPECIES[c.sp];
  c.mode = 'fly'; c.vz = 0; c.vx = clamp(c.vx, -12, 12) * 0.35; c.vy = clamp(c.vy, -12, 12) * 0.35; c.spinV = 0;
  const tf = Math.sqrt(2 * c.z / G); const lx = c.x + c.vx * tf, ly = c.y + c.vy * tf;
  const need = sp.kind === 'ray' ? sp.minDepth * 0.8 : 1.4;
  if (depthAt(lx, ly) < need || !inBounds(lx, ly, 1)){ const g = seawardPoint(lx, ly, need + 0.4); c.vx = (g.x - c.x) / tf; c.vy = (g.y - c.y) / tf; }
}

// water touches
const ptr = { down: false, id: null, lastT: 0, lx: 0, ly: 0, whirl: false };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptr.down = true; ptr.id = e.pointerId;
  const w = screenToWorld(e.clientX, e.clientY, 0);
  if (whirl.on && Math.hypot(w.x - whirl.x, w.y - whirl.y) < whirl.R * 1.1){ ptr.whirl = true; canvas.style.cursor = 'grabbing'; return; }
  ptr.whirl = false; ptr.lx = w.x; ptr.ly = w.y; ptr.lastT = performance.now();
  if (depthAt(w.x, w.y) > 0){ addDrop(w.x, w.y, 1.0, -0.9); Snd.plink(w.x / (world.W / 2), 0.07); }
  scareAt(w.x, w.y, 7);
});
canvas.addEventListener('pointermove', e => {
  const w = screenToWorld(e.clientX, e.clientY, 0);
  if (!ptr.down || e.pointerId !== ptr.id){
    if (whirl.on) canvas.style.cursor = Math.hypot(w.x - whirl.x, w.y - whirl.y) < whirl.R * 1.1 ? 'grab' : 'crosshair';
    return;
  }
  if (ptr.whirl){ if (depthAt(w.x, w.y) > 1.2){ whirl.x = w.x; whirl.y = w.y; } return; }
  const now = performance.now();
  if (now - ptr.lastT > 28){ const d = Math.hypot(w.x - ptr.lx, w.y - ptr.ly);
    if (depthAt(w.x, w.y) > 0) addDrop(w.x, w.y, 0.8, -0.25 - Math.min(d, 3) * 0.12);
    if (d > 0.4) scareAt(w.x, w.y, 6);
    ptr.lx = w.x; ptr.ly = w.y; ptr.lastT = now; }
});
const ptrEnd = e => { if (e.pointerId === ptr.id){ ptr.down = false; ptr.whirl = false; canvas.style.cursor = 'crosshair'; } };
canvas.addEventListener('pointerup', ptrEnd); canvas.addEventListener('pointercancel', ptrEnd);

// controls
const bRain = $('#bRain'), bWhirl = $('#bWhirl'), bCalm = $('#bCalm'), bSound = $('#bSound');
function setRain(v){ env.rain = v; bRain.setAttribute('aria-pressed', v); }
function setCalm(v){ env.calm = v; bCalm.setAttribute('aria-pressed', v); }
function setWhirl(v){
  whirl.on = v; bWhirl.setAttribute('aria-pressed', v);
  if (v){ whirl.R = clamp(world.a * 0.09, 4, 8); const p = seawardPoint(world.W * 0.12, -world.H * 0.02, 4); whirl.x = p.x; whirl.y = p.y; toast('Sleep de draaikolk om hem te verplaatsen.'); }
  else canvas.style.cursor = 'crosshair';
}
function setSound(v){ Snd.setOn(v); bSound.setAttribute('aria-pressed', v); $('#sndWaves').style.opacity = v ? 1 : 0.25; }
function setHidden(v){ $('#ui').hidden = v; $('#showUI').hidden = !v; }
bRain.onclick = () => setRain(!env.rain);
bWhirl.onclick = () => setWhirl(!whirl.on);
bCalm.onclick = () => setCalm(!env.calm);
bSound.onclick = () => setSound(!Snd.on);
$('#bClear').onclick = () => clearSea();
$('#bHide').onclick = () => setHidden(true);
$('#showUI').onclick = () => setHidden(false);
$('#sndWaves').style.opacity = 0.25;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'r') setRain(!env.rain); else if (k === 'w') setWhirl(!whirl.on); else if (k === 'c') setCalm(!env.calm);
  else if (k === 'm') setSound(!Snd.on); else if (k === 'h') setHidden(!$('#ui').hidden);
});

// ------------------------------------------------------------------ thumbnails from the real models
function makeThumbs(){
  const S = 240; const rt = new THREE.WebGLRenderTarget(S, S, { depthBuffer: true });
  const ts = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(30, 4 / 3, 0.1, 400); cam.up.set(0, 0, 1);
  rt.setSize(Math.round(S * 4 / 3), S);
  const Wt = Math.round(S * 4 / 3);
  const px = new Uint8Array(Wt * S * 4); const cv = document.createElement('canvas'); cv.width = Wt; cv.height = S; const cx = cv.getContext('2d'); const id = cx.createImageData(Wt, S);
  setPass(3);
  const tan = Math.tan(15 * Math.PI / 180);
  for (const key of KEYS){
    const sp = SPECIES[key]; const objs = [];
    if (sp.kind === 'ray'){
      const m = meshes[key]; objs.push(m);
      dummy.position.set(0, 0, 0); dummy.rotation.set(-0.05, 0.12, Math.atan2(-1, -0.6) - Math.PI / 2, 'ZXY'); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
      m.setMatrixAt(0, dummy.matrix); m.geometry.attributes.aAnim.setXYZW(0, 1.2, sp.flap, sp.und * 0.8, 0.37); m.count = 1;
      m.instanceMatrix.needsUpdate = true; m.geometry.attributes.aAnim.needsUpdate = true;
      const size = Math.max(sp.span, sp.len + sp.tail * 0.4) * 1.05; const d = size / (2 * tan) / 1.25;
      cam.position.set(0, -d * 0.6, d * 0.8); cam.lookAt(-sp.tail * 0.05, sp.tail * 0.12, 0);
    } else {
      const j = makeJelly(key, 0, 0, 0); j.size = sp.size; j.ax = 0; j.ay = -0.18; j.az = 1; j.c = 0.3; j.spin = 0.3;
      const l = Math.hypot(j.ax, j.ay, j.az); j.ax /= l; j.ay /= l; j.az /= l;
      const list = [j];
      const m = meshes[key]; jellyMatrix(j, _m); m.setMatrixAt(0, _m); m.geometry.attributes.aJ.setXYZW(0, j.c, 0, 0, 1); m.count = 1; m.instanceMatrix.needsUpdate = true; m.geometry.attributes.aJ.needsUpdate = true; objs.push(m);
      let zc;
      if (key === 'moon'){ const f = meshes.fringe; f.setMatrixAt(0, _m); f.geometry.attributes.aJ.setXYZW(0, j.c, 0, 0, 1); f.count = 1; f.instanceMatrix.needsUpdate = true; f.geometry.attributes.aJ.needsUpdate = true; objs.push(f); zc = -0.15; }
      else {
        const M = jellyMatrix(j, new THREE.Matrix4()); const r0 = new THREE.Vector3();
        for (const ch of j.chains){ chainRoot(j, ch, M, r0); const seg = ch.seg * j.size; const lat = ch.ang;
          for (let i = 0; i < ch.n; i++){ const o = i * 3; const sw = Math.sin(i * 0.35 + lat * 2) * 0.12 * i * seg * (ch.kind ? 0.6 : 1);
            ch.p[o] = r0.x + Math.cos(lat) * (sw + i * seg * 0.05); ch.p[o + 1] = r0.y + Math.sin(lat) * (sw + i * seg * 0.05); ch.p[o + 2] = r0.z - seg * i * 0.97; } }
        objs.push(ribbons.mesh); zc = -2.4 * j.size;
        const size = 6.8 * j.size; const d = size / (2 * tan);
        cam.position.set(0, -d * 0.94, zc + d * 0.34); cam.lookAt(0, 0, zc);
        ribbons.write(list, cam.position, 0);
      }
      if (key === 'moon'){ const size = 3.3 * j.size; const d = size / (2 * tan) / 1.2; cam.position.set(0, -d * 0.8, zc + d * 0.6); cam.lookAt(0, 0, zc); }
    }
    for (const o of objs) ts.add(o);
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(ts, cam);
    renderer.readRenderTargetPixels(rt, 0, 0, Wt, S, px);
    for (let y = 0; y < S; y++) for (let x = 0; x < Wt; x++){
      const si = ((S - 1 - y) * Wt + x) * 4, di = (y * Wt + x) * 4; const a = px[si + 3];
      const k = a > 0 ? 255 / a : 0;
      id.data[di] = Math.min(255, px[si] * k); id.data[di + 1] = Math.min(255, px[si + 1] * k); id.data[di + 2] = Math.min(255, px[si + 2] * k); id.data[di + 3] = a;
    }
    cx.putImageData(id, 0, 0);
    cards[key].querySelector('img').src = cv.toDataURL();
    for (const o of objs) ts.remove(o);
  }
  for (const k of ['manta', 'eagle', 'sting', 'moon', 'nettle', 'fringe']) meshes[k].count = 0;
  renderer.setRenderTarget(null); rt.dispose(); setPass(0);
}

// ------------------------------------------------------------------ frame
function addToScene(){
  for (const k of ['manta', 'eagle', 'sting', 'moon', 'nettle', 'fringe']) scene.add(meshes[k]);
  scene.add(ribbons.mesh); scene.add(airFx.mesh); scene.add(underFx.mesh);
}

let time = 0, simAcc = 0, lastWave = null, rainAcc = 0;
const perf = { acc: 0, frames: 0, good: 0 };
function syncUniforms(){
  U.uWorld.value.set(world.W, world.H);
  const u = compMat.uniforms;
  u.tBed.value = bedTex; u.uShoreR.value = world.shoreR; u.uLambda.value = world.lambda; u.uBreakW.value = world.breakW; u.uT.value = world.T;
}
function frame(dt){
  time += dt; U.uTime.value = time;
  const u = compMat.uniforms;
  u.uSwell.value = lerp(u.uSwell.value, env.calm ? 0.09 : 0.3, Math.min(1, dt * 1.2));
  u.uChop.value = lerp(u.uChop.value, env.calm ? 0.4 : 1, Math.min(1, dt * 1.2));
  u.uRun.value = world.run * Math.sqrt(u.uSwell.value / 0.3);
  env.overcast = lerp(env.overcast, env.rain ? 1 : 0, Math.min(1, dt * 0.8)); u.uOvercast.value = env.overcast;
  simUpdateMat.uniforms.uCalm.value = env.calm ? 1 : 0;
  whirl.str = lerp(whirl.str, whirl.on ? 1 : 0, Math.min(1, dt * 0.9));
  u.uWhirl.value.set(whirl.x, whirl.y, whirl.str, whirl.R);
  if (whirl.str > 0.05 && rnd() < dt * 12){ const a = time * 3 + rnd() * TAU, rr = whirl.R * (0.4 + rnd() * 0.5); addDrop(whirl.x + Math.cos(a) * rr, whirl.y + Math.sin(a) * rr, 0.6, -0.12 * whirl.str); }

  // surf sound, timed to the swash at the middle of the beach
  const thc = -Math.PI / 4; const lagC = 0.08 * Math.sin(thc * 3 + 0.5);
  const wph = time / world.T + lagC + 0.04; const wn = Math.floor(wph);
  if (lastWave !== null && wn !== lastWave) Snd.surf((0.75 + 0.5 * h11(wn)) * Math.sqrt(u.uSwell.value / 0.3), world.T, 0.3);
  lastWave = wn;

  // rain
  if (env.rain){
    rainAcc += dt * world.W * world.H / 260;
    while (rainAcc > 1){ rainAcc -= 1; const x = (rnd() - 0.5) * world.W, y = (rnd() - 0.5) * world.H;
      if (depthAt(x, y) > 0){ addDrop(x, y, 0.28 + rnd() * 0.15, -0.3 - rnd() * 0.15);
        if (rnd() < 0.25) airFx.add({ type: 1, x, y, z: 0.03, size: 0.15, grow: 1.4, life: 0.5, age: 0, alpha: 0.6 });
        if (rnd() < 0.3) Snd.plink(x / (world.W / 2), 0.03 + rnd() * 0.03); } }
  }

  for (let i = rays.length - 1; i >= 0; i--){ const r = rays[i]; updateRay(r, dt, time);
    if (r.removing){ r.fade -= dt * 1.6; if (r.fade <= 0){ rays.splice(i, 1); updateCounter(); } } }
  for (let i = jellies.length - 1; i >= 0; i--){ const j = jellies[i]; updateJelly(j, dt, time);
    if (j.removing){ j.fade -= dt * 1.6; if (j.fade <= 0){ jellies.splice(i, 1); updateCounter(); } } }
  updateFx(dt);
  writeInstances();
  ribbons.write(jellies, camera.position, time);
  airFx.write(); underFx.write();

  simAcc = Math.min(simAcc + dt, 3 / 60);
  while (simAcc >= 1 / 60){ simAcc -= 1 / 60; simStep(); }
  compMat.uniforms.tSim.value = simA.texture;

  // shadows
  setPass(2); palm.visible = true; airFx.mesh.visible = false; underFx.mesh.visible = false;
  renderer.setRenderTarget(shadowRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, camera);
  palm.visible = false;
  // under water creatures
  setPass(0); underFx.mesh.visible = underFx.items.length > 0;
  renderer.setRenderTarget(underRT); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
  underFx.mesh.visible = false;
  // composite
  compMat.uniforms.tShadow.value = shadowRT.texture; compMat.uniforms.tUnder.value = underRT.texture;
  renderer.setRenderTarget(null); renderer.setClearColor(0x0b3a5c, 1); renderer.clear(); renderer.render(compScene, quadCam);
  // above the water
  const anyAir = rays.some(r => r.z > -0.5) || jellies.some(j => j.z > -0.5) || airFx.items.length > 0;
  if (anyAir){ setPass(1); airFx.mesh.visible = airFx.items.length > 0; renderer.clearDepth(); renderer.render(scene, camera); }
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(raw, 1 / 20);
  if (document.hidden) return;
  frame(dt);
  // adaptive quality
  perf.acc += raw; perf.frames++;
  if (perf.acc > 2){
    const ms = perf.acc / perf.frames * 1000; perf.acc = 0; perf.frames = 0;
    if (ms > 24 && qLevel < QUALITY.length - 1){ qLevel++; perf.good = 0; applySize(); }
    else if (ms < 15 && qLevel > 0 && QUALITY[qLevel - 1].pr <= DPR + 0.01){ if (++perf.good >= 4){ qLevel--; perf.good = 0; applySize(); } }
    else perf.good = 0;
  }
}

function layoutWorld(){
  computeWorld(); bake(); syncUniforms(); applySize(); makeSim(); rebuildPalm();
}
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => {
  const oldW = world.W, oldH = world.H; layoutWorld();
  for (const c of [...rays, ...jellies]){ c.x *= world.W / oldW; c.y *= world.H / oldH;
    if (c.mode === 'swim' || c.mode === 'drift' || c.mode === 'rest'){ const need = c.kind === 'ray' ? SPECIES[c.sp].minDepth : 1.5;
      if (depthAt(c.x, c.y) < need){ const p = seawardPoint(c.x, c.y, need + 0.5); c.x = p.x; c.y = p.y; }
      const fl = -Math.max(depthAt(c.x, c.y), 0); if (c.z < fl + 0.3) c.z = fl + 0.4; if (c.chains) resetChains(c); } }
}, 200); });

layoutWorld();
makeThumbs();
addToScene();
seedSea();
requestAnimationFrame(t => { last = t; loop(t); });
window.__sea = { rays, jellies, world, splash, setWhirl, setRain, throwCreature, cards, spawn, releaseHeld, qLevel: () => qLevel };
})();
</script>
